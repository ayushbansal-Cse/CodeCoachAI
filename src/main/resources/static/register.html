<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Create Account | CodeCoach AI</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family:
                    Arial,
                    Helvetica,
                    sans-serif;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 15px;

            background:
                    radial-gradient(
                            circle at 15% 15%,
                            rgba(99, 102, 241, 0.25),
                            transparent 30%
                    ),

                    radial-gradient(
                            circle at 85% 80%,
                            rgba(168, 85, 247, 0.22),
                            transparent 30%
                    ),

                    #070b18;

            overflow-x: hidden;
        }


        /* Background Glow */

        .glow {

            position: fixed;

            width: 320px;
            height: 320px;

            border-radius: 50%;

            filter: blur(110px);

            opacity: 0.25;

            pointer-events: none;

            z-index: -1;
        }


        .glow.one {

            background: #6366f1;

            top: -120px;
            left: -120px;
        }


        .glow.two {

            background: #a855f7;

            bottom: -120px;
            right: -120px;
        }


        /* Main Card */

        .register-container {

            width: 100%;

            max-width: 460px;

            padding: 42px;


            background:
                    linear-gradient(
                            145deg,
                            rgba(255, 255, 255, 0.09),
                            rgba(255, 255, 255, 0.035)
                    );


            border:
                    1px solid
                    rgba(255, 255, 255, 0.13);


            border-radius: 26px;


            backdrop-filter: blur(22px);

            -webkit-backdrop-filter: blur(22px);


            box-shadow:
                    0 30px 80px
                    rgba(0, 0, 0, 0.45);


            animation:
                    cardAppear 0.7s ease;
        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                        translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                        translateY(0);
            }
        }


        /* Logo */

        .logo {

            text-align: center;

            margin-bottom: 32px;
        }


        .logo-icon {

            width: 58px;
            height: 58px;

            margin:
                    0 auto 16px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 18px;


            background:
                    linear-gradient(
                            135deg,
                            #4f46e5,
                            #7c3aed
                    );


            box-shadow:
                    0 12px 35px
                    rgba(99, 102, 241, 0.35);


            font-size: 26px;
        }


        .logo h1 {

            font-size: 30px;

            margin-bottom: 8px;
        }


        .logo h1 span {

            background:
                    linear-gradient(
                            90deg,
                            #60a5fa,
                            #818cf8,
                            #c084fc
                    );


            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .logo p {

            color: #8996b3;

            font-size: 14px;
        }


        /* Form */

        .form-group {

            margin-bottom: 19px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;

            font-size: 14px;

            font-weight: 500;
        }


        input {

            width: 100%;

            padding: 14px 16px;

            border-radius: 12px;

            border:
                    1px solid
                    rgba(255, 255, 255, 0.12);


            background:
                    rgba(255, 255, 255, 0.055);


            color: white;

            font-size: 15px;

            outline: none;

            transition:
                    all 0.3s ease;
        }


        input::placeholder {

            color: #68758f;
        }


        input:focus {

            border-color:
                    #818cf8;


            background:
                    rgba(255, 255, 255, 0.08);


            box-shadow:
                    0 0 0 3px
                    rgba(129, 140, 248, 0.12);
        }


        /* Password Hint */

        .password-hint {

            margin-top: 7px;

            color: #68758f;

            font-size: 12px;
        }


        /* Register Button */

        .register-btn {

            width: 100%;

            margin-top: 8px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;


            background:
                    linear-gradient(
                            135deg,
                            #4f46e5,
                            #7c3aed
                    );


            box-shadow:
                    0 10px 30px
                    rgba(99, 102, 241, 0.30);


            transition:
                    all 0.3s ease;
        }


        .register-btn:hover {

            transform:
                    translateY(-2px);


            box-shadow:
                    0 15px 40px
                    rgba(99, 102, 241, 0.50);
        }


        .register-btn:active {

            transform:
                    translateY(0);
        }


        .register-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }


        /* Login */

        .login-text {

            text-align: center;

            margin-top: 25px;

            color: #8996b3;

            font-size: 14px;
        }


        .login-text a {

            color: #818cf8;

            text-decoration: none;

            font-weight: 600;
        }


        .login-text a:hover {

            text-decoration: underline;
        }


        /* Back */

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #68758f;

            text-decoration: none;

            font-size: 13px;

            transition: 0.2s;
        }


        .back:hover {

            color: #a5b4fc;
        }


        /* Message */

        .message {

            display: none;

            margin-top: 18px;

            padding: 12px 14px;

            border-radius: 10px;

            text-align: center;

            font-size: 13px;
        }


        .message.success {

            display: block;

            background:
                    rgba(34, 197, 94, 0.10);


            border:
                    1px solid
                    rgba(34, 197, 94, 0.25);


            color: #86efac;
        }


        .message.error {

            display: block;

            background:
                    rgba(239, 68, 68, 0.10);


            border:
                    1px solid
                    rgba(239, 68, 68, 0.25);


            color: #fca5a5;
        }


        /* Mobile */

        @media (max-width: 500px) {

            body {

                padding:
                        20px 12px;
            }


            .register-container {

                padding:
                        30px 22px;

                border-radius:
                        22px;
            }


            .logo h1 {

                font-size: 26px;
            }
        }

    </style>

</head>


<body>


<!-- Background -->

<div class="glow one"></div>

<div class="glow two"></div>


<!-- Register Card -->

<div class="register-container">


    <!-- Logo -->

    <div class="logo">

        <div class="logo-icon">
            🚀
        </div>


        <h1>
            CodeCoach <span>AI</span>
        </h1>


        <p>
            Create your developer account
        </p>

    </div>


    <!-- Register Form -->

    <form
            id="registerForm"
            onsubmit="registerUser(event)"
    >


        <!-- Name -->

        <div class="form-group">

            <label for="name">
                Full Name
            </label>


            <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
            >

        </div>


        <!-- Email -->

        <div class="form-group">

            <label for="email">
                Email
            </label>


            <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
            >

        </div>


        <!-- Password -->

        <div class="form-group">

            <label for="password">
                Password
            </label>


            <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
            >


            <div class="password-hint">

                Password must be at least
                6 characters.

            </div>

        </div>


        <!-- Confirm Password -->

        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>


            <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
            >

        </div>


        <!-- Button -->

        <button
                type="submit"
                class="register-btn"
                id="registerButton"
        >

            Create Account 🚀

        </button>


    </form>


    <!-- Message -->

    <div
            id="message"
            class="message">
    </div>


    <!-- Login -->

    <div class="login-text">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>


    <!-- Home -->

    <a
            href="index.html"
            class="back">

        ← Back to CodeCoach AI

    </a>


</div>


<script>


    async function registerUser(event) {

        event.preventDefault();


        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        const message =
            document
                .getElementById("message");


        const button =
            document
                .getElementById("registerButton");


        /* Password Check */

        if (password !== confirmPassword) {

            message.className =
                "message error";


            message.innerText =
                "❌ Passwords do not match.";


            return;
        }


        /* Loading */

        button.disabled = true;

        button.innerText =
            "Creating Account...";


        try {


            /* Send Data To Spring Boot */

            const response =
                await fetch(
                    "/api/users/register",
                    {

                        method: "POST",


                        headers: {

                            "Content-Type":
                                "application/json"

                        },


                        body:
                            JSON.stringify({

                                name:
                                name,

                                email:
                                email,

                                password:
                                password

                            })

                    }
                );


            const data =
                await response.text();


            /* Success */

            if (response.ok) {


                message.className =
                    "message success";


                message.innerText =
                    "✅ Account created successfully!";


                button.innerText =
                    "Account Created ✓";


                /* Go to Login */

                setTimeout(
                    function () {

                        window.location.href =
                            "login.html";

                    },
                    2000
                );


            }


            /* Error */

            else {


                message.className =
                    "message error";


                message.innerText =
                    "❌ " + data;


                button.disabled =
                    false;


                button.innerText =
                    "Create Account 🚀";

            }


        }


            /* Server Error */

        catch (error) {


            console.error(
                "Registration error:",
                error
            );


            message.className =
                "message error";


            message.innerText =
                "❌ Server se connection nahi ho paaya.";


            button.disabled =
                false;


            button.innerText =
                "Create Account 🚀";

        }

    }


</script>


</body>

</html>

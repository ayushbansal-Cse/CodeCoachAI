<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | CodeCoach AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family:
                    Arial,
                    Helvetica,
                    sans-serif;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            background:
                    radial-gradient(
                            circle at 10% 10%,
                            rgba(99,102,241,.28),
                            transparent 30%
                    ),
                    radial-gradient(
                            circle at 90% 90%,
                            rgba(168,85,247,.25),
                            transparent 30%
                    ),
                    radial-gradient(
                            circle at 50% 50%,
                            rgba(59,130,246,.08),
                            transparent 45%
                    ),
                    #070b18;

            overflow: hidden;
        }

        /* =========================
           BACKGROUND GLOW
        ========================= */

        .glow {
            position: fixed;

            width: 380px;
            height: 380px;

            border-radius: 50%;

            filter: blur(120px);

            opacity: .28;

            pointer-events: none;

            z-index: -1;

            animation:
                    floatGlow 8s ease-in-out infinite;
        }

        .glow.one {
            background: #6366f1;

            top: -180px;
            left: -180px;
        }

        .glow.two {
            background: #a855f7;

            right: -180px;
            bottom: -180px;

            animation-delay: 2s;
        }

        @keyframes floatGlow {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(25px, -20px);
            }
        }

        /* =========================
           LOGIN CARD
        ========================= */

        .login-container {

            width: 100%;
            max-width: 450px;

            padding: 42px;

            border-radius: 28px;

            background:
                    linear-gradient(
                            145deg,
                            rgba(255,255,255,.10),
                            rgba(255,255,255,.035)
                    );

            border:
                    1px solid
                    rgba(255,255,255,.14);

            backdrop-filter: blur(25px);

            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                    0 35px 100px
                    rgba(0,0,0,.55),

                    inset 0 1px 0
                    rgba(255,255,255,.08);

            animation:
                    cardAppear .7s ease;

            position: relative;

            overflow: hidden;
        }

        .login-container::before {

            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            top: -130px;
            right: -100px;

            background:
                    radial-gradient(
                            circle,
                            rgba(129,140,248,.25),
                            transparent 70%
                    );

            pointer-events: none;
        }

        @keyframes cardAppear {

            from {
                opacity: 0;

                transform:
                        translateY(25px)
                        scale(.96);
            }

            to {
                opacity: 1;

                transform:
                        translateY(0)
                        scale(1);
            }
        }

        /* =========================
           LOGO
        ========================= */

        .logo {

            text-align: center;

            margin-bottom: 34px;

            position: relative;
            z-index: 2;
        }

        .logo-icon {

            width: 64px;
            height: 64px;

            margin:
                    0 auto 17px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 19px;

            background:
                    linear-gradient(
                            135deg,
                            #4f46e5,
                            #7c3aed
                    );

            border:
                    1px solid
                    rgba(255,255,255,.15);

            box-shadow:
                    0 14px 40px
                    rgba(99,102,241,.40);

            font-size: 28px;

            animation:
                    iconFloat 4s ease-in-out infinite;
        }

        @keyframes iconFloat {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .logo h1 {

            font-size: 31px;

            letter-spacing: -1px;

            margin-bottom: 8px;
        }

        .logo h1 span {

            background:
                    linear-gradient(
                            90deg,
                            #60a5fa,
                            #818cf8,
                            #c084fc
                    );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }

        .logo p {

            color: #8996b3;

            font-size: 14px;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 20px;

            position: relative;
            z-index: 2;
        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;

            font-size: 14px;

            font-weight: 600;
        }

        input {

            width: 100%;

            padding: 15px 16px;

            border-radius: 13px;

            border:
                    1px solid
                    rgba(255,255,255,.12);

            outline: none;

            background:
                    rgba(255,255,255,.055);

            color: white;

            font-size: 15px;

            transition:
                    all .3s ease;
        }

        input::placeholder {

            color: #68758f;
        }

        input:hover {

            border-color:
                    rgba(255,255,255,.20);
        }

        input:focus {

            border-color:
                    #818cf8;

            background:
                    rgba(255,255,255,.08);

            box-shadow:
                    0 0 0 3px
                    rgba(129,140,248,.13),

                    0 8px 25px
                    rgba(0,0,0,.15);
        }

        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {

            width: 100%;

            margin-top: 7px;

            padding: 15px;

            border: none;

            border-radius: 13px;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            background:
                    linear-gradient(
                            135deg,
                            #4f46e5,
                            #7c3aed
                    );

            box-shadow:
                    0 12px 35px
                    rgba(99,102,241,.35);

            transition:
                    all .3s ease;

            position: relative;

            overflow: hidden;

            z-index: 2;
        }

        .login-btn::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background:
                    linear-gradient(
                            90deg,
                            transparent,
                            rgba(255,255,255,.18),
                            transparent
                    );

            transition: .5s;
        }

        .login-btn:hover::before {

            left: 100%;
        }

        .login-btn:hover {

            transform:
                    translateY(-3px);

            box-shadow:
                    0 18px 45px
                    rgba(99,102,241,.55);
        }

        .login-btn:active {

            transform:
                    translateY(0);
        }

        .login-btn:disabled {

            opacity: .6;

            cursor: not-allowed;

            transform: none;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {

            display: none;

            margin-top: 18px;

            padding: 13px 15px;

            border-radius: 11px;

            text-align: center;

            font-size: 13px;

            position: relative;

            z-index: 2;
        }

        .message.success {

            display: block;

            color: #86efac;

            background:
                    rgba(34,197,94,.10);

            border:
                    1px solid
                    rgba(34,197,94,.25);
        }

        .message.error {

            display: block;

            color: #fca5a5;

            background:
                    rgba(239,68,68,.10);

            border:
                    1px solid
                    rgba(239,68,68,.25);
        }

        /* =========================
           REGISTER
        ========================= */

        .register-text {

            text-align: center;

            margin-top: 26px;

            color: #8996b3;

            font-size: 14px;

            position: relative;
            z-index: 2;
        }

        .register-text a {

            color: #818cf8;

            text-decoration: none;

            font-weight: 700;

            transition: .2s;
        }

        .register-text a:hover {

            color: #a5b4fc;

            text-decoration: underline;
        }

        /* =========================
           BACK HOME
        ========================= */

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #68758f;

            text-decoration: none;

            font-size: 13px;

            transition: .2s;

            position: relative;
            z-index: 2;
        }

        .back:hover {

            color: #a5b4fc;

            transform:
                    translateX(-2px);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            body {

                padding:
                        18px 12px;
            }

            .login-container {

                padding:
                        30px 22px;

                border-radius:
                        23px;
            }

            .logo h1 {

                font-size: 27px;
            }

            .logo-icon {

                width: 58px;
                height: 58px;

                font-size: 25px;
            }
        }

    </style>

</head>

<body>

<div class="glow one"></div>

<div class="glow two"></div>


<div class="login-container">

    <div class="logo">

        <div class="logo-icon">
            🔐
        </div>

        <h1>
            CodeCoach <span>AI</span>
        </h1>

        <p>
            Welcome back, developer 👋
        </p>

    </div>


    <form
            id="loginForm"
            onsubmit="loginUser(event)"
    >

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
            >

        </div>


        <button
                type="submit"
                class="login-btn"
                id="loginButton"
        >
            Login 🚀
        </button>

    </form>


    <div
            id="message"
            class="message">
    </div>


    <div class="register-text">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>


    <a
            href="index.html"
            class="back">

        ← Back to CodeCoach AI

    </a>

</div>


<script>

    async function loginUser(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const message =
            document
                .getElementById("message");


        const button =
            document
                .getElementById("loginButton");


        // =========================
        // LOADING
        // =========================

        button.disabled = true;

        button.innerText =
            "Logging in...";

        message.className =
            "message";

        message.innerText =
            "";


        try {

            /*
             * IMPORTANT:
             *
             * Relative URL use kar rahe hain.
             *
             * Agar page:
             *
             * http://localhost:8080/login.html
             *
             * par open hai,
             *
             * request automatically:
             *
             * http://localhost:8080/api/users/login
             *
             * par jayegi.
             */

            const response =
                await fetch(
                    "/api/users/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                email: email,
                                password: password
                            })
                    }
                );


            const data =
                await response.text();


            // =========================
            // SUCCESS
            // =========================

            if (response.ok) {

                message.className =
                    "message success";

                message.innerText =
                    "✅ Login successful! Welcome back.";

                button.innerText =
                    "Welcome ✓";


                // Store login state

                localStorage.setItem(
                    "codecoachUser",
                    email
                );


                // Go dashboard

                setTimeout(function () {

                    window.location.href =
                        "/dashboard.html";

                }, 800);

            }


                // =========================
                // LOGIN FAILED
            // =========================

            else {

                message.className =
                    "message error";

                message.innerText =
                    "❌ " + data;

                button.disabled =
                    false;

                button.innerText =
                    "Login 🚀";

            }

        }


            // =========================
            // CONNECTION ERROR
            // =========================

        catch (error) {

            console.error(
                "Login error:",
                error
            );


            message.className =
                "message error";


            message.innerText =
                "❌ Backend se connection nahi ho paaya. " +
                "Please make sure Spring Boot is running on port 8080.";


            button.disabled =
                false;


            button.innerText =
                "Login 🚀";

        }

    }

</script>

</body>

</html>
